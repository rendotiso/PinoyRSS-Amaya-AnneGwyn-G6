{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>User Dashboard</h2>
    <p>Welcome to PinoyRSS, {{ user.display_name|default:user.username }}!</p>
    
    <hr>
    <h3>Update Your Profile</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-full">Save Changes</button>
    </form>

    <div style="margin-top: 20px; background: #eef; padding: 15px;">
        <h4>Your Saved Bookmarks</h4>
        <p>(List bookmarks here later)</p>
    </div>
</div>
{% endblock %}
