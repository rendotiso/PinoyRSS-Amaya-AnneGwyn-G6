{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-full">Log in</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">
        No account? <a href="{% url 'signup' %}">Sign up</a>
    </p>
</div>
{% endblock %}
