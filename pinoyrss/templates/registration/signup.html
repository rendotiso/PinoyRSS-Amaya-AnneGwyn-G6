{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Create your account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-full">Sign up</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
    </p>
</div>
{% endblock %}
