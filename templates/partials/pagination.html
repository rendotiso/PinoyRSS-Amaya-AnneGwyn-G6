{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Pagination">
    {% if page.has_previous %}
    <a class="btn btn-ghost btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}" rel="prev">Previous</a>
    {% else %}<span class="btn btn-ghost btn-sm is-disabled" aria-disabled="true">Previous</span>{% endif %}
    <span class="pager-count">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}
    <a class="btn btn-ghost btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}" rel="next">Next</a>
    {% else %}<span class="btn btn-ghost btn-sm is-disabled" aria-disabled="true">Next</span>{% endif %}
</nav>
{% endif %}
