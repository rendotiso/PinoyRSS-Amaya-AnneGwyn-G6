{% extends "base.html" %}
{% block title %}Logged out | PinoyRSS{% endblock %}
{% block main_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-card auth-center">
    <svg class="auth-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    <h1>You're logged out</h1>
    <p class="muted">Your session has ended safely. Salamat sa pagbabasa!</p>
    <a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Log back in</a>
    <p class="auth-alt">Not you? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</div>
{% endblock %}
