{% extends "base.html" %}
{% block title %}Change password | PinoyRSS{% endblock %}
{% block main_class %}page-narrow{% endblock %}

{% block content %}
<header class="page-head"><h1>Change password</h1></header>
<form class="panel form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update password</button>
        <a class="btn btn-ghost" href="{% url 'accounts:profile' %}">Cancel</a>
    </div>
</form>
{% endblock %}
