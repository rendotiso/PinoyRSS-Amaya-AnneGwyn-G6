{% extends "base.html" %}
{% block title %}Sign up | PinoyRSS{% endblock %}
{% block main_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-card">
    <svg class="auth-sun" aria-hidden="true"><use href="#i-sun"/></svg>
    <h1>Create your account</h1>
    <p class="muted">Free, ad-free and no tracking. Just the news.</p>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>
    <p class="auth-alt">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
